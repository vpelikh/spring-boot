plugins {
	id 'java'
	id 'org.springframework.boot' version '{version}'
}

import org.gradle.api.DefaultTask
import org.gradle.api.provider.ListProperty
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.TaskAction
import org.gradle.api.tasks.testing.Test

// getAllJvmArgs() returns the full effective JVM args, including both the user-configured
// arg and any that the plugin appends during task graph resolution (e.g. via whenReady).
// Asserting against it confirms that AOT cache recording appends to, rather than replaces,
// the user's test JVM args.
abstract class VerifyAppendedJvmArgs extends DefaultTask {

	@Input
	abstract ListProperty<String> getJvmArgs()

	@TaskAction
	void verify() {
		println "VERIFY-JVMARGS=" + getJvmArgs().get()
		assert getJvmArgs().get().contains('-Xmx512m') : "user arg -Xmx512m missing from jvmArgs: ${getJvmArgs().get()}"
		assert getJvmArgs().get().any { it.contains('-XX:AOTCacheOutput=') } : "test missing -XX:AOTCacheOutput in jvmArgs: ${getJvmArgs().get()}"
	}

}

test {
	jvmArgs '-Xmx512m'
}

bootBuildImage {
	aotCacheRecord = true
}

tasks.register('verifyAppendedJvmArgs', VerifyAppendedJvmArgs) {
	dependsOn 'test'
	dependsOn 'bootBuildImage'
	jvmArgs = tasks.named('test', Test).map { it.allJvmArgs }
}

afterEvaluate {
	// bootBuildImage only has to be in the execution graph to trigger recording; it does
	// not need to build a container image here.
	tasks.getByName('bootBuildImage').enabled = false
}
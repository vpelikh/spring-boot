plugins {
	id 'java'
	id 'org.springframework.boot' version '{version}'
}

import org.gradle.api.DefaultTask
import org.gradle.api.provider.ListProperty
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.TaskAction
import org.gradle.api.tasks.testing.Test

// A small input-backed task so the assertion is config-cache friendly: the test task's jvmArgs
// are wired in as an @Input property and re-resolved at execution time rather than referencing
// the `tasks` container or a captured Provider from a doLast action.
abstract class VerifyAotCache extends DefaultTask {

	@Input
	abstract ListProperty<String> getJvmArgs()

	@TaskAction
	void verify() {
		assert getJvmArgs().get().any { it.contains('-XX:AOTCacheOutput=') } : "test missing -XX:AOTCacheOutput in jvmArgs: ${getJvmArgs().get()}"
	}

}

bootBuildImage {
	aotCacheRecord = true
}

tasks.register('verifyAotCache', VerifyAotCache) {
	dependsOn 'test'
	dependsOn 'bootBuildImage'
	jvmArgs = tasks.named('test', Test).map { it.jvmArgs }
}

afterEvaluate {
	// Neither bootBuildImage (nor the cache it requires) is needed to run here; it just has to
	// be present in the execution graph to trigger recording.
	tasks.getByName('bootBuildImage').enabled = false
}
